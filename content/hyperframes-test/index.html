<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:Fredoka;src:url(assets/fredoka700.woff2) format("woff2");font-weight:700}
:root{--ground:#1f1b2e;--ink:#fff;--sun:#ffd23f;--pink:#ff5fa2;--mint:#3ddc97;--sky:#4cc9f0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ground)}
#root{position:relative;width:100%;height:100%;font-family:Fredoka,sans-serif;color:var(--ink);overflow:hidden}
.clip{position:absolute;inset:0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ask{font-size:96px;line-height:1.05;padding:0 80px}
.num{position:absolute;font-size:170px;color:var(--sun);text-shadow:8px 8px 0 #000}
.pg{position:absolute;width:560px;border-radius:14px;box-shadow:0 30px 60px rgba(0,0,0,.5);border:6px solid #fff}
.big{font-size:260px;color:var(--sun);line-height:.9;text-shadow:10px 10px 0 var(--pink)}
.sub{font-size:92px;margin-top:20px}
.pill{margin-top:60px;background:var(--mint);color:#1f1b2e;font-size:64px;padding:22px 54px;border-radius:99px;border:6px solid #000}
.flash{background:#fff}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1920">
  <audio id="music" src="assets/music_blue_sky_mp3.mp3" data-start="0" data-duration="9" data-volume="0.5" data-fade-out="1"></audio>

  <div id="s1" class="clip center" data-start="0" data-duration="3">
    <div class="ask" id="ask">Pick a number.</div>
    <div class="num" id="n1" style="left:90px;top:300px">$100</div>
    <div class="num" id="n2" style="right:70px;top:520px">$500</div>
    <div class="num" id="n3" style="left:120px;top:1250px">$1,000</div>
    <div class="num" id="n4" style="right:60px;top:1460px">$4,000</div>
    <div class="num" id="n5" style="left:200px;top:1640px;color:var(--pink)">$10,000</div>
  </div>

  <div id="s2" class="clip" data-start="3" data-duration="3">
    <div class="ask center" id="ask2" style="position:absolute;top:120px;left:0;right:0">There's a page for it.</div>
    <img class="pg" id="p1" src="assets/pg35.png" style="left:60px;top:520px">
    <img class="pg" id="p2" src="assets/pg39.png" style="left:460px;top:600px">
    <img class="pg" id="p3" src="assets/pg23.png" style="left:260px;top:760px">
  </div>

  <div id="s3" class="clip center" data-start="6" data-duration="3">
    <div class="big" id="big">63</div>
    <div class="sub" id="sub">savings challenges</div>
    <div class="pill" id="pill">one download</div>
  </div>

  <div id="flash" class="clip flash" data-start="2.9" data-duration="0.3"></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
// Scene 1: question lands, numbers pop in on the beat
tl.fromTo("#ask", { scale: 1.6 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 0);
["#n1","#n2","#n3","#n4","#n5"].forEach((id, i) => {
  tl.from(id, { scale: 0, rotation: [-20, 15, -12, 22, -8][i], opacity: 0, duration: 0.3, ease: "back.out(3)" }, 0.5 + i * 0.35);
});
tl.to("#s1 .num", { y: -40, duration: 1.2, ease: "sine.inOut", stagger: 0.05 }, 1.6);
// Flash cut
tl.fromTo("#flash", { opacity: 0.9 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, 2.9);
// Scene 2: pages slam in
tl.from("#ask2", { y: -80, opacity: 0, duration: 0.35, ease: "power3.out" }, 3);
tl.from("#p1", { x: -900, rotation: -40, duration: 0.45, ease: "power4.out" }, 3.25);
tl.from("#p2", { x: 900, rotation: 40, duration: 0.45, ease: "power4.out" }, 3.55);
tl.from("#p3", { y: 1400, rotation: 10, duration: 0.5, ease: "power4.out" }, 3.85);
tl.to("#p1", { rotation: -8, duration: 1.5, ease: "sine.inOut" }, 4.2);
tl.to("#p2", { rotation: 7, duration: 1.5, ease: "sine.inOut" }, 4.2);
tl.to("#p3", { scale: 1.08, duration: 1.5, ease: "sine.inOut" }, 4.4);
// Scene 3: count up to 63
const c = { v: 0 };
tl.from("#big", { scale: 0.2, opacity: 0, duration: 0.4, ease: "back.out(2.5)" }, 6);
tl.to(c, { v: 63, duration: 1.1, ease: "power2.out", onUpdate: () => { document.getElementById("big").textContent = Math.round(c.v); } }, 6);
tl.from("#sub", { y: 60, opacity: 0, duration: 0.35, ease: "power3.out" }, 6.6);
tl.from("#pill", { scale: 0, duration: 0.3, ease: "back.out(3)" }, 6.75);
tl.to("#pill", { scale: 1.08, yoyo: true, repeat: 3, duration: 0.2, ease: "sine.inOut" }, 7.2);
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
