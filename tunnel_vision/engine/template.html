<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;overflow:hidden}

/* themes (per-video variety) */
#phone{--bg:#fff;--fg:#000;--hdr:rgba(247,247,247,.96);--hdrline:#dcdcdf;--in:#e9e9eb;--infg:#000;--out:#0a84ff;--outfg:#fff;--accent:#0a84ff;
  --muted:#8e8e93;--kb:#d2d4da;--key:#fff;--keyfg:#000;--keydark:#abb0ba;--keyshadow:#898a8e;--keydown:#c5c7cd;--field:#d3d3d8;--plus:#efeff1;--home:#111;--status:#000;--ph:#b9b9be;--radius:50px}
#phone.dark{--bg:#000;--fg:#fff;--hdr:rgba(22,22,24,.96);--hdrline:#2c2c2e;--in:#262628;--infg:#fff;--muted:#8e8e93;--kb:#2b2b2d;--key:#6b6b6e;--keyfg:#fff;--keydark:#464648;--keyshadow:#1a1a1a;--keydown:#8a8a8d;--field:#3a3a3c;--plus:#2c2c2e;--home:#fff;--status:#fff;--ph:#6e6e73}
#phone.green{--out:#34c759;--accent:#0a84ff}
#phone.work{--hdr:#4a3aa8;--hdrline:#3d2f8f;--in:#f1effa;--infg:#1d1b26;--out:#5b4bd6;--accent:#5b4bd6;--radius:22px;--status:#fff}
#phone.delivery{--hdr:#fff6ee;--hdrline:#f2dcc6;--out:#f0702e;--accent:#f0702e}
#phone{background:var(--bg);color:var(--fg)}
.status{position:absolute;top:0;left:0;right:0;height:140px;display:flex;align-items:center;justify-content:space-between;padding:30px 70px 0 110px;font-weight:600;font-size:48px;letter-spacing:-.5px;color:var(--status);z-index:3}
.status svg{display:block;fill:var(--status)}
.header{position:absolute;top:0;left:0;right:0;height:390px;padding-top:140px;background:var(--hdr);border-bottom:2px solid var(--hdrline);text-align:center}
.back{position:absolute;left:34px;top:202px}
.avatar{width:126px;height:126px;border-radius:50%;margin:22px auto 0;color:#fff;font-weight:600;font-size:60px;display:flex;align-items:center;justify-content:center}
.cname{margin-top:12px;font-size:34px;color:var(--fg);font-weight:500}
.cname span{color:var(--muted);font-size:30px;margin-left:6px}
.work .cname,.work .cname span{color:#fff}
.sub{font-size:26px;color:var(--muted);margin-top:2px}
.work .sub{color:#d6d0ff}
.video-ic{position:absolute;right:46px;top:224px}
#thread{position:absolute;top:400px;left:0;right:0;height:700px;padding:0 44px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden}
.stamp{text-align:center;color:var(--muted);font-size:32px;font-weight:500;margin:4px 0 18px}
.stamp b{font-weight:600}
.row{display:flex;width:100%;margin-bottom:10px}
.row.in{justify-content:flex-start}
.row.out{justify-content:flex-end}
.bubble{position:relative;max-width:78%;padding:26px 42px 28px;border-radius:var(--radius);font-size:62px;line-height:1.2;letter-spacing:-.4px}
.in .bubble{background:var(--in);color:var(--infg);transform-origin:0% 100%}
.out .bubble{background:var(--out);color:var(--outfg);transform-origin:100% 100%}
.in .bubble.tail:before{content:"";position:absolute;bottom:0;left:-18px;width:52px;height:64px;background:var(--in);border-bottom-right-radius:42px 36px;z-index:0}
.in .bubble.tail:after{content:"";position:absolute;bottom:0;left:-68px;width:68px;height:64px;background:var(--bg);border-bottom-right-radius:26px;z-index:1}
.out .bubble.tail:before{content:"";position:absolute;bottom:0;right:-18px;width:52px;height:64px;background:var(--out);border-bottom-left-radius:42px 36px;z-index:0}
.out .bubble.tail:after{content:"";position:absolute;bottom:0;right:-68px;width:68px;height:64px;background:var(--bg);border-bottom-left-radius:26px;z-index:1}
.work .bubble.tail:before,.work .bubble.tail:after{display:none}
.work .in .bubble{border-bottom-left-radius:6px}.work .out .bubble{border-bottom-right-radius:6px}
.bubble span{position:relative;z-index:2}
.who{font-size:28px;color:var(--muted);margin:0 0 6px 20px;font-weight:600}
.receipt{text-align:right;color:var(--muted);font-size:31px;font-weight:500;margin:-2px 14px 14px 0}
.receipt b{font-weight:600}
.dots{display:flex;gap:14px;align-items:center;padding:34px 40px}
.dots i{display:block;width:24px;height:24px;border-radius:50%;background:var(--muted)}
.typing .bubble:before{content:"";position:absolute;left:-6px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:var(--in)}
.typing .bubble:after{content:"";position:absolute;left:-22px;bottom:-22px;width:14px;height:14px;border-radius:50%;background:var(--in)}
.voice{display:flex;align-items:center;gap:22px;padding:22px 34px 22px 22px}
.voice .play{width:84px;height:84px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.voice .wave{display:flex;align-items:center;gap:6px;height:70px}
.voice .wave i{display:block;width:8px;border-radius:4px;background:var(--muted)}
.voice .dur{font-size:38px;color:var(--muted);font-weight:500;margin-left:6px}
.voice .unplayed{width:18px;height:18px;border-radius:50%;background:var(--accent);margin-left:4px}

.inputbar{position:absolute;top:1104px;left:0;right:0;height:116px;display:flex;align-items:center;gap:22px;padding:0 34px;background:var(--bg)}
.plus{width:84px;height:84px;border-radius:50%;background:var(--plus);display:flex;align-items:center;justify-content:center;flex:none}
.field{flex:1;height:90px;border:2.5px solid var(--field);border-radius:46px;display:flex;align-items:center;padding:0 16px 0 36px;font-size:48px;color:var(--fg);position:relative;white-space:nowrap;overflow:hidden}
.field .ph{color:var(--ph)}
.caret{display:inline-block;width:4px;height:56px;background:var(--accent);margin-left:3px;vertical-align:middle}
.send{position:absolute;right:10px;top:9px;width:68px;height:68px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center}
.mic{position:absolute;right:24px;top:16px}
.kb{position:absolute;top:1226px;left:0;right:0;bottom:0;background:var(--kb);padding:26px 8px 0}
.krow{display:flex;justify-content:center;gap:15px;margin-bottom:31px}
.key{height:126px;width:92px;border-radius:16px;background:var(--key);box-shadow:0 3px 0 var(--keyshadow);display:flex;align-items:center;justify-content:center;font-size:58px;color:var(--keyfg);position:relative}
.key.dark{background:var(--keydark)}
.key.wide{width:136px}.key.space{width:500px;font-size:40px}.key.ret{width:220px;font-size:40px}
.key.down{background:var(--keydown)}
.pop{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:140px;height:200px;background:var(--key);border-radius:22px;box-shadow:0 4px 12px rgba(0,0,0,.25);display:flex;align-items:flex-start;justify-content:center;padding-top:22px;font-size:84px;z-index:5}
.home{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:390px;height:14px;border-radius:7px;background:var(--home)}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:8}
#sheet{position:absolute;left:0;right:0;bottom:0;height:900px;background:var(--bg);border-radius:48px 48px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);z-index:9;text-align:center;padding-top:30px;display:none}
#sheet .grab{width:120px;height:12px;border-radius:6px;background:#d0d0d4;margin:0 auto 60px}
#sheet h3{font-size:58px;font-weight:700;letter-spacing:-.5px}
#sheet p{font-size:36px;color:var(--muted);margin-top:16px}
#sheet .stars{display:flex;justify-content:center;gap:26px;margin-top:70px}
#sheet .btn{margin:90px auto 0;width:860px;height:130px;border-radius:65px;background:var(--accent);color:#fff;font-size:46px;font-weight:600;display:flex;align-items:center;justify-content:center}
#shade{position:absolute;inset:0;background:#000;opacity:0;z-index:8;display:none}

/* reveal */
#reveal{background:#111}
#art{position:absolute;inset:0;transform-origin:540px 980px}
#art svg{width:1080px;height:1920px;display:block}
.rtext{position:absolute;left:70px;right:70px;top:250px;height:440px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff3e4;font-family:"Inter Display","Inter",sans-serif;font-weight:700;font-size:86px;line-height:1.14;letter-spacing:-1px;text-shadow:0 4px 30px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.6);text-wrap:balance}
#fade{position:absolute;inset:0;background:#000;opacity:0}
</style></head>
<body>
<div id="phone" class="scene">
  <div class="header">
    <svg class="back" width="44" height="74" viewBox="0 0 44 74"><path d="M38 6L8 37l30 31" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="avatar" id="avatar"></div>
    <div class="cname" id="cname"></div>
    <div class="sub" id="csub"></div>
    <svg class="video-ic" width="86" height="56" viewBox="0 0 86 56"><rect x="2" y="6" width="56" height="44" rx="12" fill="none" stroke="currentColor" stroke-width="6"/><path d="M62 22l20-12v36L62 34z" fill="currentColor"/></svg>
  </div>
  <div class="status">
    <div id="clock"></div>
    <div style="display:flex;gap:18px;align-items:center">
      <svg width="62" height="40" viewBox="0 0 62 40"><rect x="0" y="28" width="11" height="12" rx="3"/><rect x="17" y="20" width="11" height="20" rx="3"/><rect x="34" y="11" width="11" height="29" rx="3"/><rect x="51" y="2" width="11" height="38" rx="3"/></svg>
      <svg width="56" height="40" viewBox="0 0 56 40"><path d="M28 38l8-9a12 12 0 00-16 0z"/><path d="M28 18c6 0 11 2 15 6l5-5C43 14 36 11 28 11s-15 3-20 8l5 5c4-4 9-6 15-6z"/><path d="M28 4c10 0 19 4 25 10l3-3C49 4 39 0 28 0S7 4 0 11l3 3C9 8 18 4 28 4z"/></svg>
      <svg width="92" height="44" viewBox="0 0 92 44"><rect x="2" y="2" width="78" height="40" rx="12" fill="none" stroke="currentColor" stroke-width="3" opacity=".4"/><rect id="batt" x="7" y="7" width="58" height="30" rx="8"/><path d="M85 15v14c4-1 6-4 6-7s-2-6-6-7z" opacity=".4"/></svg>
    </div>
  </div>
  <div id="thread"></div>
  <div class="inputbar">
    <div class="plus"><svg width="40" height="40" viewBox="0 0 40 40"><path d="M20 4v32M4 20h32" stroke="#7d7d83" stroke-width="5" stroke-linecap="round"/></svg></div>
    <div class="field" id="field"></div>
  </div>
  <div class="kb" id="kb"></div>
  <div id="shade"></div>
  <div id="sheet"><div class="grab"></div><h3 id="shTitle"></h3><p id="shSub"></p><div class="stars" id="stars"></div><div class="btn" id="shBtn">Submit</div></div>
  <div id="dim"></div>
</div>

<div id="reveal" class="scene" style="display:none">
  <div id="art">__SVG__</div>
  <div class="rtext" id="rtext"></div>
  <div id="fade"></div>
</div>

<script>
const CFG = __CFG__;
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const easeOut=x=>1-Math.pow(1-clamp(x),3);
function pop(dt){ if(dt<0) return null; const x=clamp(dt/0.30);
  return {s: x<1 ? 0.55+0.45*easeOut(x)+0.07*Math.sin(Math.PI*x) : 1, o: clamp(dt/0.10)}; }
const END=CFG.end||20.0, XF=END-0.38, CUT=CFG.cut||9.0;

// header
const ph=$("#phone"); if(CFG.theme && CFG.theme!=="light") ph.classList.add(CFG.theme);
$("#avatar").textContent=CFG.initial; $("#avatar").style.background=`linear-gradient(${CFG.avatar[0]},${CFG.avatar[1]})`;
$("#cname").innerHTML=CFG.contact+"<span>›</span>"; $("#csub").textContent=CFG.sub||"";
ph.querySelector(".header").style.color = CFG.theme==="work" ? "#fff" : "var(--accent)";
if(CFG.sub){ ph.querySelector(".header").style.height="420px"; $("#thread").style.top="432px"; $("#thread").style.height="668px"; }
$("#batt").setAttribute("width", String(Math.round(58*(CFG.battery||0.8))));

// keyboard
const ROWS=[["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l"],["⇧","z","x","c","v","b","n","m","⌫"],["123","☺","space","return"]];
(function(){ const kb=$("#kb");
  ROWS.forEach((r,ri)=>{ const row=document.createElement("div"); row.className="krow";
    r.forEach(k=>{ const d=document.createElement("div"); d.className="key"; d.dataset.k=k;
      if(k==="⇧"||k==="⌫"){d.classList.add("dark","wide"); d.style.fontSize="50px";}
      if(k==="123"||k==="☺"){d.classList.add("dark","wide"); d.style.fontSize=k==="☺"?"54px":"40px";}
      if(k==="space") d.classList.add("space"); if(k==="return") d.classList.add("dark","ret");
      d.textContent=k; row.appendChild(d); });
    if(ri===2){ row.style.justifyContent="space-between"; row.style.padding="0 8px"; }
    kb.appendChild(row); });
  const h=document.createElement("div"); h.className="home"; kb.appendChild(h); })();

// stars for rating sheet
(function(){ const s=$("#stars"); for(let i=0;i<5;i++){ s.insertAdjacentHTML("beforeend",`<svg width="130" height="124" viewBox="0 0 24 23"><path class="st" d="M12 1l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.1 5.6 20.6 7 13.5 1.7 8.5l7.2-.9z" fill="#d6d6db"/></svg>`);} })();

const EV=CFG.events;
const field=$("#field");
function fieldState(t){ // returns {text, key}
  let text="", key=null;
  for(const e of EV){
    if(e.t==="type" && t>=e.from){ const n=e.text.length, per=(e.to-e.from)/n; const i=Math.min(n-1,Math.floor((t-e.from)/per));
      if(t<e.to){ text=(e.base||"")+e.text.slice(0,i+1); const w=(t-e.from)-i*per; key = w<per*0.8 ? e.text[i] : null; }
      else text=(e.base||"")+e.text; }
    if(e.t==="erase" && t>=e.from){ const n=e.count, per=(e.to-e.from)/n; const i=Math.min(n,Math.floor((t-e.from)/per)+1);
      const full=e.text; if(t<e.to){ text=full.slice(0,full.length-i); key=((t-e.from)%per)<per*0.7?"⌫":null; } else text=full.slice(0,full.length-n); }
    if(e.t==="msg" && e.side==="out" && t>=e.at && e.at>=0) { text=""; key=null; }
  }
  return {text,key};
}
function bubble(side,text,p,who){
  const st=p?`transform:scale(${p.s.toFixed(4)});opacity:${p.o.toFixed(3)}`:"";
  return (who?`<div class="who">${who}</div>`:"")+`<div class="row ${side}"><div class="bubble tail" style="${st}"><span>${text}</span></div></div>`; }
function dotsBubble(dt){ const p=pop(dt)||{s:1,o:1}; let ds="";
  for(let i=0;i<3;i++){ const ph=((dt*1000)%1200)/1200; const k=(ph*3-i+3)%3; const a=k<1?0.45+0.55*Math.sin(Math.PI*k):0.45;
    ds+=`<i style="opacity:${a.toFixed(3)};transform:translateY(${(-(a-0.45)*10).toFixed(2)}px)"></i>`; }
  return `<div class="row in typing"><div class="bubble" style="padding:0;transform:scale(${p.s.toFixed(4)});opacity:${p.o.toFixed(3)}"><div class="dots">${ds}</div></div></div>`; }
function voiceBubble(e,p,t){ let w=""; for(let i=0;i<26;i++){ const h=14+Math.abs(Math.sin(i*1.7)*40+Math.sin(i*0.6)*14); w+=`<i style="height:${h.toFixed(0)}px"></i>`; }
  const pulse = 0.55+0.45*Math.abs(Math.sin(t*2.4));
  return `<div class="row in"><div class="bubble tail" style="padding:0;transform:scale(${p.s.toFixed(4)});opacity:${p.o.toFixed(3)}"><div class="voice"><div class="play"><svg width="34" height="40" viewBox="0 0 34 40"><path d="M4 3l28 17L4 37z" fill="#fff"/></svg></div><div class="wave">${w}</div><span class="dur">${e.dur}</span><span class="unplayed" style="opacity:${pulse.toFixed(2)}"></span></div></div></div>`; }

function renderPhone(t){
  let h=""; let clock=CFG.clock;
  for(const e of EV){
    if(e.t==="stamp"){ if(e.at<=t) h+=`<div class="stamp" style="opacity:${e.at<0?1:clamp((t-e.at)/0.3)}">${e.text}</div>`; }
    else if(e.t==="msg"){ if(e.at<=t) h+=bubble(e.side,e.text,e.at<0?null:pop(t-e.at),e.who); }
    else if(e.t==="voice"){ if(e.at<=t) h+=voiceBubble(e,pop(t-e.at)||{s:1,o:1},t); }
    else if(e.t==="dots"){ if(t>=e.from && t<e.to) h+=dotsBubble(t-e.from+(e.phase||0)); }
    else if(e.t==="receipt"){ if(e.at<=t) h+=`<div class="receipt" style="opacity:${e.at<0?1:clamp((t-e.at)/0.25)}">${e.text}</div>`; }
    else if(e.t==="clock"){ if(e.at<=t) clock=e.time; }
  }
  const th=$("#thread"); th.innerHTML=h; th.scrollTop=th.scrollHeight; $("#clock").textContent=clock;
  // dim (night spiral)
  let dim=0; for(const e of EV) if(e.t==="dim" && t>=e.from) dim=e.amount*clamp((t-e.from)/(e.to-e.from)); $("#dim").style.opacity=dim;
  // input
  const fs=fieldState(t); const typingNow = EV.some(e=>(e.t==="type"||e.t==="erase") && t>=e.from && t<e.to+0.15);
  const caretOn = typingNow || Math.floor((t+20)*1.9)%2===0;
  const caret=`<span class="caret" style="opacity:${caretOn?1:0}"></span>`;
  if(fs.text.length){ field.innerHTML=`<span>${fs.text}</span>${caret}<div class="send"><svg width="34" height="40" viewBox="0 0 34 40"><path d="M17 36V6M5 17L17 5l12 12" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
    const nxt=EV.find(e=>e.t==="msg"&&e.side==="out"&&e.at>t); if(nxt && nxt.at-t<0.12) field.querySelector(".send").style.transform="scale(.86)"; }
  else field.innerHTML=`${caret}<span class="ph">Message</span><svg class="mic" width="40" height="58" viewBox="0 0 40 58"><rect x="11" y="2" width="18" height="34" rx="9" fill="#b0b0b6"/><path d="M4 26a16 16 0 0032 0M20 42v12" stroke="#b0b0b6" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`;
  document.querySelectorAll(".key").forEach(k=>{ k.classList.remove("down"); const p=k.querySelector(".pop"); if(p) p.remove(); });
  if(fs.key){ const kk=fs.key===" "?"space":fs.key.toLowerCase(); const el=document.querySelector(`.key[data-k="${CSS.escape(kk)}"]`);
    if(el){ el.classList.add("down"); if(kk!=="space"&&kk!=="⌫"&&kk.length===1){ const p=document.createElement("div"); p.className="pop"; p.textContent=kk; el.appendChild(p);} } }
  // rating sheet
  const r=EV.find(e=>e.t==="rating"); const sh=$("#sheet"), sd=$("#shade");
  if(r && t>=r.at){ const k=easeOut((t-r.at)/0.4); sh.style.display="block"; sd.style.display="block"; sd.style.opacity=0.35*k;
    sh.style.transform=`translateY(${(1-k)*900}px)`; $("#shTitle").textContent=r.title; $("#shSub").textContent=r.sub;
    document.querySelectorAll("#stars .st").forEach((s,i)=>{ const on = t>=r.tap && i<r.stars; s.setAttribute("fill", on?"#ffb800":"#d6d6db");
      s.parentNode.style.transform = (on && t-r.tap<0.25) ? `scale(${1+0.25*Math.sin(Math.PI*(t-r.tap)/0.25)})` : ""; });
    const b=$("#shBtn"); b.style.opacity = t>=r.tap ? 1 : 0.45; b.style.transform = (t>=r.submit && t<r.submit+0.15) ? "scale(.96)" : "";
    if(t>=r.submit+0.2){ $("#shTitle").textContent=r.done; $("#shSub").textContent=""; b.style.opacity=0; } }
  else { sh.style.display="none"; sd.style.display="none"; }
}

function renderReveal(t){
  const p=clamp((t-CUT)/(END-CUT)); const s=1.0+0.065*p+0.065*(p*p*(3-2*p));
  $("#art").style.transform=`scale(${s.toFixed(5)})`;
  let html="";
  for(const [a,b,txt] of CFG.cards){ if(t>=a && t<b){ const fin=clamp((t-a)/0.35), fout= b>=END ? 1 : clamp((b-t)/0.25);
      const op=Math.min(fin,fout), y=(1-easeOut(fin))*24; const fs = txt.split(" ").length>11 ? 74 : 86;
      html=`<div style="opacity:${op.toFixed(3)};transform:translateY(${y.toFixed(2)}px);font-size:${fs}px">${txt}</div>`; } }
  $("#rtext").innerHTML=html;
  $("#fade").style.opacity = t<CUT+0.25 ? (1-clamp((t-CUT)/0.25))*0.9 : 0;
}
window.render=function(t){
  const phone=$("#phone"), rev=$("#reveal");
  if(t<CUT){ phone.style.display="block"; rev.style.display="none"; rev.style.opacity=1; renderPhone(t); }
  else if(t<XF){ phone.style.display="none"; rev.style.display="block"; rev.style.opacity=1; renderReveal(t); }
  else { phone.style.display="block"; renderPhone(t-END); rev.style.display="block"; rev.style.opacity=(1-clamp((t-XF)/(END-XF))).toFixed(4); renderReveal(t); }
};
window.render(0);
</script>
</body></html>
