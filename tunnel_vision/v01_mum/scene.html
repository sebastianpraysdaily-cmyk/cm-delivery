<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;overflow:hidden}

/* ---------- PHONE ---------- */
#phone{background:#fff;color:#000}
.status{position:absolute;top:0;left:0;right:0;height:140px;display:flex;align-items:center;justify-content:space-between;padding:30px 70px 0 110px;font-weight:600;font-size:48px;letter-spacing:-.5px}
.status svg{display:block}
.header{position:absolute;top:140px;left:0;right:0;height:250px;background:rgba(247,247,247,.96);border-bottom:2px solid #dcdcdf;text-align:center}
.back{position:absolute;left:34px;top:62px}
.avatar{width:126px;height:126px;border-radius:50%;margin:22px auto 0;background:linear-gradient(#a6abb6,#868b96);color:#fff;font-weight:600;font-size:60px;display:flex;align-items:center;justify-content:center}
.cname{margin-top:12px;font-size:34px;color:#111;font-weight:500}
.cname span{color:#9a9aa0;font-size:30px;margin-left:6px}
.video-ic{position:absolute;right:46px;top:84px}
#thread{position:absolute;top:400px;left:0;right:0;height:690px;padding:0 44px;display:flex;flex-direction:column;justify-content:flex-start}
.stamp{text-align:center;color:#8e8e93;font-size:32px;font-weight:500;margin:4px 0 18px}
.stamp b{font-weight:600}
.row{display:flex;width:100%;margin-bottom:10px}
.row.in{justify-content:flex-start}
.row.out{justify-content:flex-end}
.bubble{position:relative;max-width:78%;padding:26px 42px 28px;border-radius:50px;font-size:62px;line-height:1.2;letter-spacing:-.4px;will-change:transform}
.in .bubble{background:#e9e9eb;color:#000;transform-origin:0% 100%}
.out .bubble{background:#0a84ff;color:#fff;transform-origin:100% 100%}
.in .bubble.tail:before{content:"";position:absolute;bottom:0;left:-18px;width:52px;height:64px;background:#e9e9eb;border-bottom-right-radius:42px 36px;z-index:0}
.in .bubble.tail:after{content:"";position:absolute;bottom:0;left:-68px;width:68px;height:64px;background:#fff;border-bottom-right-radius:26px;z-index:1}
.out .bubble.tail:before{content:"";position:absolute;bottom:0;right:-18px;width:52px;height:64px;background:#0a84ff;border-bottom-left-radius:42px 36px;z-index:0}
.out .bubble.tail:after{content:"";position:absolute;bottom:0;right:-68px;width:68px;height:64px;background:#fff;border-bottom-left-radius:26px;z-index:1}
.bubble span{position:relative;z-index:2}
.receipt{text-align:right;color:#8e8e93;font-size:31px;font-weight:500;margin:-2px 14px 14px 0}
.receipt b{font-weight:600}
.dots{display:flex;gap:14px;align-items:center;padding:34px 40px}
.dots i{display:block;width:24px;height:24px;border-radius:50%;background:#8e8e93}
.typing .bubble:before{content:"";position:absolute;left:-6px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:#e9e9eb}
.typing .bubble:after{content:"";position:absolute;left:-22px;bottom:-22px;width:14px;height:14px;border-radius:50%;background:#e9e9eb}

.inputbar{position:absolute;top:1104px;left:0;right:0;height:116px;display:flex;align-items:center;gap:22px;padding:0 34px;background:#fff}
.plus{width:84px;height:84px;border-radius:50%;background:#efeff1;display:flex;align-items:center;justify-content:center;flex:none}
.field{flex:1;height:90px;border:2.5px solid #d3d3d8;border-radius:46px;display:flex;align-items:center;padding:0 16px 0 36px;font-size:48px;color:#000;position:relative;white-space:nowrap;overflow:hidden}
.field .ph{color:#b9b9be}
.caret{display:inline-block;width:4px;height:56px;background:#0a84ff;margin-left:3px;vertical-align:middle}
.send{position:absolute;right:10px;top:9px;width:68px;height:68px;border-radius:50%;background:#0a84ff;display:flex;align-items:center;justify-content:center}
.mic{position:absolute;right:24px;top:16px}

.kb{position:absolute;top:1226px;left:0;right:0;bottom:0;background:#d2d4da;padding:26px 8px 0}
.krow{display:flex;justify-content:center;gap:15px;margin-bottom:31px}
.key{height:126px;width:92px;border-radius:16px;background:#fff;box-shadow:0 3px 0 #898a8e;display:flex;align-items:center;justify-content:center;font-size:58px;color:#000;position:relative;font-weight:400}
.key.dark{background:#abb0ba}
.key.wide{width:136px}
.key.space{width:500px;font-size:40px}
.key.ret{width:220px;font-size:40px}
.key.down{background:#c5c7cd}
.pop{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:140px;height:200px;background:#fff;border-radius:22px;box-shadow:0 4px 12px rgba(0,0,0,.25);display:flex;align-items:flex-start;justify-content:center;padding-top:22px;font-size:84px;z-index:5}
.home{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:390px;height:14px;border-radius:7px;background:#111}

<script>
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const easeOut=x=>1-Math.pow(1-clamp(x),3);
// pop: overshoot spring 0 -> 1
function pop(dt){ if(dt<0) return null; const d=0.30; const x=clamp(dt/d);
  const s = x<1 ? 0.55 + 0.45*easeOut(x) + 0.07*Math.sin(Math.PI*x) : 1; return {s, o:clamp(dt/0.10)}; }

// ---------------- TIMELINE ----------------
const T = {
  mum1: 0.25,
  typeStart: 1.25, typeEnd: 2.85, reply:"why do you always ask that",
  send: 3.05, read: 3.75,
  dotsA: [4.25, 5.05], dotsB: [5.35, 6.05], mum2: 6.05,
  dotsC: [7.35, 8.45],
  cut: 9.0,
  cards: [
    [9.55, 12.45, "She asks because it’s the one question she knows you’ll answer."],
    [12.6, 15.0, "Anything deeper and you go quiet."],
    [15.15, 17.75, "So every day she checks"],
    [17.9, 20.0, "the only way you let her…"]
  ],
  xfade: 19.62, end: 20.0
};
window.T = T;

// ---------------- KEYBOARD ----------------
const ROWS=[["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l"],["⇧","z","x","c","v","b","n","m","⌫"],["123","☺","space","return"]];
function buildKB(){
  const kb=$("#kb"); kb.innerHTML="";
  ROWS.forEach((r,ri)=>{ const row=document.createElement("div"); row.className="krow";
    r.forEach(k=>{ const d=document.createElement("div"); d.className="key"; d.dataset.k=k;
      if(k==="⇧"||k==="⌫"){d.classList.add("dark","wide"); d.style.fontSize="50px";}
      if(k==="123"||k==="☺"){d.classList.add("dark","wide"); d.style.fontSize= k==="☺"?"54px":"40px";}
      if(k==="space"){d.classList.add("space");}
      if(k==="return"){d.classList.add("dark","ret");}
      d.textContent=k; row.appendChild(d); });
    if(ri===2){ row.style.justifyContent="space-between"; row.style.padding="0 8px"; }
    kb.appendChild(row); });
  const h=document.createElement("div"); h.className="home"; kb.appendChild(h);
}
buildKB();

function typedAt(t){ const n=T.reply.length; if(t<T.typeStart) return {n:0,key:null};
  if(t>=T.send) return {n:0,key:null};
  const per=(T.typeEnd-T.typeStart)/n; const i=Math.floor((t-T.typeStart)/per);
  const cnt=Math.min(n,i+1); const within=(t-T.typeStart)-i*per;
  const key = (i<n && within<per*0.8) ? T.reply[i] : null;
  return {n:cnt,key}; }

// ---------------- PHONE RENDER ----------------
function bubble(side, text, p, tail=true){
  const st = p ? `transform:scale(${p.s.toFixed(4)});opacity:${p.o.toFixed(3)}` : "";
  return `<div class="row ${side}"><div class="bubble ${tail?'tail':''}" style="${st}"><span>${text}</span></div></div>`; }
function dotsBubble(dt){
  const p=pop(dt); let ds="";
  for(let i=0;i<3;i++){ const ph=((dt*1000/1)%1200)/1200; const k=(ph*3 - i + 3)%3; const a = k<1 ? 0.45+0.55*Math.sin(Math.PI*k) : 0.45;
    ds+=`<i style="opacity:${a.toFixed(3)};transform:translateY(${(-(a-0.45)*10).toFixed(2)}px)"></i>`; }
  return `<div class="row in typing"><div class="bubble" style="padding:0;transform:scale(${p.s.toFixed(4)});opacity:${p.o.toFixed(3)}"><div class="dots">${ds}</div></div></div>`; }
const inR=(t,[a,b])=>t>=a&&t<b;

function renderPhone(t){
  let h=`<div class="stamp"><b>Today</b> 9:41 PM</div>`;
  if(t<T.mum1) h+=dotsBubble(t+0.6);
  else h+=bubble("in","did you eat today?",pop(t-T.mum1));
  if(t>=T.send){ h+=bubble("out","why do you always ask that",pop(t-T.send));
    if(t>=T.read){ const o=clamp((t-T.read)/0.25); h+=`<div class="receipt" style="opacity:${o}"><b>Read</b> 9:42 PM</div>`; } }
  if(inR(t,T.dotsA)) h+=dotsBubble(t-T.dotsA[0]);
  if(inR(t,T.dotsB)) h+=dotsBubble(t-T.dotsB[0]);
  if(t>=T.mum2) h+=bubble("in","just checking",pop(t-T.mum2));
  if(inR(t,T.dotsC)) h+=dotsBubble(t-T.dotsC[0]);
  $("#thread").innerHTML=h;

  // input field
  const ty=typedAt(t); const f=$("#field");
  const caretOn = Math.floor(t*1.9)%2===0 || (t>=T.typeStart && t<T.send);
  const caret = `<span class="caret" style="opacity:${caretOn?1:0}"></span>`;
  if(ty.n>0){ f.innerHTML = `<span>${T.reply.slice(0,ty.n)}</span>${caret}<div class="send"><svg width="34" height="40" viewBox="0 0 34 40"><path d="M17 36V6M5 17L17 5l12 12" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
    const sd=f.querySelector(".send"); if(t>=T.send-0.12) sd.style.transform="scale(.86)"; }
  else f.innerHTML = `${caret}<span class="ph">Message</span><svg class="mic" width="40" height="58" viewBox="0 0 40 58"><rect x="11" y="2" width="18" height="34" rx="9" fill="#b0b0b6"/><path d="M4 26a16 16 0 0032 0M20 42v12" stroke="#b0b0b6" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`;
  // keys
  document.querySelectorAll(".key").forEach(k=>{ k.classList.remove("down"); const p=k.querySelector(".pop"); if(p) p.remove(); });
  if(ty.key){ const kk = ty.key===" " ? "space" : ty.key; const el=document.querySelector(`.key[data-k="${kk}"]`);
    if(el){ el.classList.add("down"); if(kk!=="space"){ const p=document.createElement("div"); p.className="pop"; p.textContent=kk; el.appendChild(p);} } }
}

// ---------------- REVEAL RENDER ----------------
function renderReveal(t){
  const p=clamp((t-T.cut)/(T.end-T.cut));
  const s=1.0+0.13*(p*p*(3-2*p))*0.5+0.065*p; // slow, steady push-in
  $("#art").style.transform=`scale(${s.toFixed(5)})`;
  let html="", op=0;
  for(const [a,b,txt] of T.cards){ if(t>=a && t<b){ const fin=clamp((t-a)/0.35), fout = b>=T.end ? 1 : clamp((b-t)/0.25);
      op=Math.min(fin,fout); const y=(1-easeOut(fin))*24; html=`<div style="opacity:${op.toFixed(3)};transform:translateY(${y.toFixed(2)}px)">${txt}</div>`; } }
  $("#rtext").innerHTML=html;
  $("#fade").style.opacity = t<T.cut+0.25 ? (1-clamp((t-T.cut)/0.25))*0.9 : 0;
}

// ---------------- MASTER ----------------
window.render = function(t){
  const phone=$("#phone"), rev=$("#reveal");
  if(t < T.cut){ phone.style.display="block"; rev.style.display="none"; rev.style.opacity=1; renderPhone(t); }
  else if(t < T.xfade){ phone.style.display="none"; rev.style.display="block"; rev.style.opacity=1; renderReveal(t); }
  else { // crossfade into frame 0 so the loop is seamless
    phone.style.display="block"; renderPhone(t - T.end); rev.style.display="block";
    rev.style.opacity = (1-clamp((t-T.xfade)/(T.end-T.xfade))).toFixed(4); renderReveal(t); }
};
window.render(0);
</script>
</body></html>
